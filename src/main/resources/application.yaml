spring:
  application:
    name: meshmind
  config:
    import: optional:file:.env[.properties]
app:
  llm:
    # switch between "openai" and "gemini" without touching code
    provider: openai
  ingest:
    # if true, each Slack thread is summarized by the LLM before embedding
    # (cleaner retrieval on noisy chat data, at the cost of extra LLM calls on startup)
    summarize: true
    # per-thread summary cache; regenerated automatically if missing or incomplete
    summary-cache-path: data/slack_summaries.json
  milvus:
    host: localhost
    port: 19530
    collection-name: meshmind_slack
    # must match the embedding model's output dim (nomic-embed-text = 768)
    dimension: 768
langchain4j:
  google:
    ai:
      gemini:
        api-key: ${GEMINI_API_KEY:}
        model-name: gemini-2.5-flash
  open-ai:
    api-key: ${OPENAI_API_KEY:}
    model-name: gpt-4o-mini
logging:
  level:
    com.devara.ai.meshmind.data.SlackDataLoader: DEBUG
    # per-retriever + fusion diagnostics (vector, bm25, and fused RRF output)
    com.devara.ai.meshmind.rag: DEBUG
